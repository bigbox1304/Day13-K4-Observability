alerts:
  - name: High latency
    severity: warning
    condition: response latency p95 > 3000 ms for 5 minutes
    type: symptom-based
    owner: platform-oncall
    runbook: docs/alerts.md#alert-1
  - name: Elevated error rate
    severity: critical
    condition: request error rate > 2% for 5 minutes
    type: symptom-based
    owner: platform-oncall
    runbook: docs/alerts.md#alert-2
  - name: Quality degradation
    severity: warning
    condition: quality proxy mean < 0.75 for 10 minutes
    type: symptom-based
    owner: ai-platform
    runbook: docs/alerts.md#alert-3
